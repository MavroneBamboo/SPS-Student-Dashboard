services:
  proxy:
    image: nginx:1.27.3-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./prototype:/usr/share/nginx/html/prototype:ro
    networks: [public, private]
    restart: unless-stopped

  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://sps_app:${POSTGRES_PASSWORD}@db:5432/sps_dashboard}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-sps-student-dashboard}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-sps-browser}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-bootstrap-admin}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?set BOOTSTRAP_PASSWORD in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks: [private]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_DB: sps_dashboard
      POSTGRES_USER: sps_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sps_app -d sps_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  public:
  private:
    internal: true

volumes:
  postgres-data:
