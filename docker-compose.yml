services:
  proxy:
    image: sps-student-dashboard-proxy:${APP_BUILD_SHA:-local}
    build:
      context: .
      dockerfile: deploy/nginx.Dockerfile
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${STAGING_BIND_ADDRESS:-127.0.0.1}:8080:80"
    networks: [public, private]
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        INSTALL_TEST_DEPENDENCIES: ${INSTALL_TEST_DEPENDENCIES:-false}
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_BUILD_SHA: ${APP_BUILD_SHA:-unknown}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env to the restricted sps_runtime account}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-sps-student-dashboard}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-sps-browser}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-bootstrap-admin}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?set BOOTSTRAP_PASSWORD in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
      APP_ENCRYPTION_PREVIOUS_KEYS: ${APP_ENCRYPTION_PREVIOUS_KEYS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    networks: [private]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      args:
        INSTALL_TEST_DEPENDENCIES: ${INSTALL_TEST_DEPENDENCIES:-false}
    command: ["sh", "-c", "alembic upgrade head && python -m app.db_permissions"]
    environment:
      DATABASE_URL: ${DATABASE_ADMIN_URL:-postgresql+psycopg://sps_app:${POSTGRES_PASSWORD}@db:5432/sps_dashboard}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:-postgresql+psycopg://sps_app:${POSTGRES_PASSWORD}@db:5432/sps_dashboard}
      DATABASE_RUNTIME_PASSWORD: ${DATABASE_RUNTIME_PASSWORD:?set DATABASE_RUNTIME_PASSWORD in .env}
    depends_on:
      tde-setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks: [private]
    restart: "no"

  tde-setup:
    build:
      context: .
      args:
        INSTALL_TEST_DEPENDENCIES: ${INSTALL_TEST_DEPENDENCIES:-false}
    command: ["python", "-m", "app.tde_setup", "--verify"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_ADMIN_URL:-postgresql+psycopg://sps_app:${POSTGRES_PASSWORD}@db:5432/sps_dashboard}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:-postgresql+psycopg://sps_app:${POSTGRES_PASSWORD}@db:5432/sps_dashboard}
      TDE_PROVIDER: ${TDE_PROVIDER:-file}
      TDE_PROVIDER_NAME: ${TDE_PROVIDER_NAME:-sps-key-provider}
      TDE_DEFAULT_KEY_NAME: ${TDE_DEFAULT_KEY_NAME:-sps-default-key}
      TDE_SERVER_KEY_NAME: ${TDE_SERVER_KEY_NAME:-sps-wal-key}
      TDE_FILE_KEY_PATH: ${TDE_FILE_KEY_PATH:-/var/lib/postgresql/tde-keyring/pg_tde_keyring}
      TDE_VAULT_URL: ${TDE_VAULT_URL:-}
      TDE_VAULT_MOUNT: ${TDE_VAULT_MOUNT:-tde/data/sps-dashboard}
      TDE_VAULT_TOKEN_FILE: ${TDE_VAULT_TOKEN_FILE:-/run/secrets/pg-tde-vault-token}
      TDE_VAULT_CA_FILE: ${TDE_VAULT_CA_FILE:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    restart: "no"

  tde-restore-setup:
    profiles: [maintenance]
    build:
      context: .
      args:
        INSTALL_TEST_DEPENDENCIES: ${INSTALL_TEST_DEPENDENCIES:-false}
    command: ["sh", "-c", "python -m app.tde_setup --prepare && python -m app.db_permissions"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://sps_app:${POSTGRES_PASSWORD}@db:5432/${RESTORE_TARGET_DATABASE:-sps_restore_target}
      DATABASE_ADMIN_URL: postgresql+psycopg://sps_app:${POSTGRES_PASSWORD}@db:5432/${RESTORE_TARGET_DATABASE:-sps_restore_target}
      DATABASE_RUNTIME_PASSWORD: ${DATABASE_RUNTIME_PASSWORD:?set DATABASE_RUNTIME_PASSWORD in .env}
      DATABASE_RUNTIME_ROLE: ${DATABASE_RUNTIME_ROLE:-sps_runtime}
      TDE_PROVIDER: ${TDE_PROVIDER:-file}
      TDE_PROVIDER_NAME: ${TDE_PROVIDER_NAME:-sps-key-provider}
      TDE_DEFAULT_KEY_NAME: ${TDE_DEFAULT_KEY_NAME:-sps-default-key}
      TDE_SERVER_KEY_NAME: ${TDE_SERVER_KEY_NAME:-sps-wal-key}
      TDE_FILE_KEY_PATH: ${TDE_FILE_KEY_PATH:-/var/lib/postgresql/tde-keyring/pg_tde_keyring}
      TDE_VAULT_URL: ${TDE_VAULT_URL:-}
      TDE_VAULT_MOUNT: ${TDE_VAULT_MOUNT:-tde/data/sps-dashboard}
      TDE_VAULT_TOKEN_FILE: ${TDE_VAULT_TOKEN_FILE:-/run/secrets/pg-tde-vault-token}
      TDE_VAULT_CA_FILE: ${TDE_VAULT_CA_FILE:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    restart: "no"

  postgres-data-init:
    image: percona/percona-distribution-postgresql:17.11.1-4-ubi8
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for directory in /var/lib/postgresql/data /var/lib/postgresql/tde-keyring; do
          if [ "$$(stat -c '%u' "$$directory")" != 26 ]; then chown -R 26:26 "$$directory"; fi
          chmod 700 "$$directory"
        done
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - tde-keyring:/var/lib/postgresql/tde-keyring
    restart: "no"

  db:
    image: percona/percona-distribution-postgresql:17.11.1-4-ubi8
    command: ["postgres", "-c", "shared_preload_libraries=pg_tde", "-c", "pg_tde.cipher=aes_256"]
    environment:
      POSTGRES_DB: sps_dashboard
      POSTGRES_USER: sps_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data
    depends_on:
      postgres-data-init:
        condition: service_completed_successfully
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - tde-keyring:/var/lib/postgresql/tde-keyring
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sps_app -d sps_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  database-backup:
    profiles: [maintenance]
    user: "${BACKUP_CONTAINER_UID:-1000}:${BACKUP_CONTAINER_GID:-1000}"
    image: sps-database-maintenance:${DATABASE_MAINTENANCE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/database-maintenance.Dockerfile
    command: ["backup"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-sps_dashboard}
      PGUSER: ${BACKUP_DATABASE_USER:-sps_runtime}
      PGPASSWORD: ${BACKUP_DATABASE_PASSWORD:-${DATABASE_RUNTIME_PASSWORD:-${POSTGRES_PASSWORD}}}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_DIRECTORY: /backups
      BACKUP_FILE: ${BACKUP_FILE:-}
    volumes:
      - ${BACKUP_HOST_PATH:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    restart: "no"

  database-restore:
    profiles: [maintenance]
    user: "${BACKUP_CONTAINER_UID:-1000}:${BACKUP_CONTAINER_GID:-1000}"
    image: sps-database-maintenance:${DATABASE_MAINTENANCE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/database-maintenance.Dockerfile
    command: ["restore"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${RESTORE_TARGET_DATABASE:-sps_restore_target}
      PGUSER: ${POSTGRES_USER:-sps_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      RESTORE_TARGET_ACK: ${RESTORE_TARGET_ACK:-}
      BACKUP_DIRECTORY: /backups
      BACKUP_FILE: ${BACKUP_FILE:-}
      AGE_IDENTITY_FILE: /run/secrets/backup.agekey
    volumes:
      - ${BACKUP_HOST_PATH:-./backups}:/backups:ro
      - ${BACKUP_AGE_IDENTITY_HOST_PATH:-./secrets/backup.agekey}:/run/secrets/backup.agekey:ro
    depends_on:
      tde-restore-setup:
        condition: service_completed_successfully
    networks: [private]
    restart: "no"

  database-backup-prune:
    profiles: [maintenance]
    user: "${BACKUP_CONTAINER_UID:-1000}:${BACKUP_CONTAINER_GID:-1000}"
    image: sps-database-maintenance:${DATABASE_MAINTENANCE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/database-maintenance.Dockerfile
    command: ["prune"]
    environment:
      BACKUP_DIRECTORY: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-90}
    volumes:
      - ${BACKUP_HOST_PATH:-./backups}:/backups
    networks: [private]
    restart: "no"

networks:
  public:
  private:
    internal: true

volumes:
  postgres-data:
  tde-keyring:
