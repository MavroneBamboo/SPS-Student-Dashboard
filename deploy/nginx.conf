limit_req_zone $binary_remote_addr zone=login_by_client:10m rate=30r/m;

server {
  listen 80;
  server_tokens off;
  client_max_body_size 10m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $app_upstream app:8000;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

  location = /api/v1/auth/login {
    limit_req zone=login_by_client burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://$app_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://$app_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health/ {
    proxy_pass http://$app_upstream;
  }

  location /prototype/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;
  }

  location / {
    proxy_pass http://$app_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
