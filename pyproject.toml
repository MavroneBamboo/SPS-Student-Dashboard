[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sps-student-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.1",
  "fastapi==0.163.1",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.9",
  "psycopg[binary]==3.3.6",
  "PyJWT==2.15.1",
  "pydantic-settings==2.16.3",
  "python-multipart==0.0.33",
  "cryptography==50.0.2",
  "openpyxl==3.1.5",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
test = [
  "pytest==9.2.0",
  "httpx2==2.16.2",
  "aiosqlite==0.22.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
  "bandit==1.9.4",
  "pip-audit==2.10.1",
  "playwright==1.65.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["F", "I", "B", "UP"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.js", "static/*.png", "static/*.svg"]
