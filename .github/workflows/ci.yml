name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-and-tests:
    name: Python quality, security, migrations, and tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_DB: sps_dashboard
          POSTGRES_USER: sps_app
          POSTGRES_PASSWORD: ci-only-password #gitleaks:allow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sps_app -d sps_dashboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sps_runtime:ci-only-runtime-password@localhost:5432/sps_dashboard #gitleaks:allow
      DATABASE_ADMIN_URL: postgresql+psycopg://sps_app:ci-only-password@localhost:5432/sps_dashboard #gitleaks:allow
      DATABASE_RUNTIME_PASSWORD: ci-only-runtime-password #gitleaks:allow
      JWT_SECRET: ci-only-jwt-secret-long-enough-for-tests #gitleaks:allow
      BOOTSTRAP_PASSWORD: ci-only-bootstrap-password #gitleaks:allow
      APP_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA= #gitleaks:allow
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and CI tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Lint
        run: ruff check app tests browser_tests migrations

      - name: Check formatting
        run: ruff format --check app tests browser_tests migrations

      - name: Static security analysis
        run: bandit -q -r app

      - name: Audit Python dependencies
        run: pip-audit --skip-editable

      - name: Apply migrations to an empty PostgreSQL database
        run: alembic upgrade head

      - name: Verify migration idempotency and model parity
        run: |
          alembic upgrade head
          alembic check

      - name: Provision restricted API database account
        run: python -m app.db_permissions

      - name: Run API and business-rule tests with coverage report
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Install Chromium for browser acceptance tests
        run: python -m playwright install --with-deps chromium

      - name: Run browser authentication, administration, dashboard, and report tests
        run: pytest browser_tests

      - name: Upload synthetic browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-screenshots
          path: browser-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Compile application and migration sources
        run: python -m compileall -q app migrations

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Build and scan production container
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build --tag sps-student-dashboard:ci .

      - name: Build database maintenance image
        run: docker build --file deploy/database-maintenance.Dockerfile --tag sps-database-maintenance:ci .

      - name: Test encrypted database backup and restore in Compose
        env:
          POSTGRES_PASSWORD: ci-only-database-maintenance-password #gitleaks:allow
        run: bash deploy/test-database-maintenance.sh

      - name: Verify browser assets in the production image
        run: docker run --rm --entrypoint python sps-student-dashboard:ci -c "from importlib.resources import files; assert all(files('app').joinpath('static', name).is_file() for name in ('index.html', 'app.js', 'app.css', 'students.js', 'attendance.js', 'timetable.js', 'reference-data.js', 'timetable-print.css', 'sps-dashboard-logo.svg', 'sps-crest.png'))"

      - name: Validate reverse proxy configuration
        run: docker run --rm --add-host app:127.0.0.1 --volume "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27.3-alpine nginx -t

      - name: Verify repeated sign-in requests are throttled
        run: bash scripts/test-login-rate-limit.sh

      - name: Export the final container filesystem
        run: |
          docker create --name sps-scan-image sps-student-dashboard:ci
          docker export --output image-rootfs.tar sps-scan-image
          mkdir rootfs
          tar -xf image-rootfs.tar -C rootfs
          docker rm sps-scan-image

      - name: Scan the final container filesystem for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: rootfs
          format: json
          output: trivy-results.json
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          severity: CRITICAL,HIGH

      - name: Scan the database maintenance image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: sps-database-maintenance:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          severity: CRITICAL,HIGH

      - name: Summarize container scan findings
        if: always()
        run: |
          if [ -f trivy-results.json ]; then
            jq -r '.Results[]? | select(.Vulnerabilities != null) | .Target as $target | .Vulnerabilities[] | [$target, .PkgName, .InstalledVersion, .FixedVersion, .VulnerabilityID, .Severity] | @tsv' trivy-results.json
          fi

      - name: Upload container scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-container-scan-${{ github.run_id }}
          path: trivy-results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-password #gitleaks:allow
          DATABASE_URL: postgresql+psycopg://sps_runtime:ci-only-runtime-password@db:5432/sps_dashboard #gitleaks:allow
          DATABASE_ADMIN_URL: postgresql+psycopg://sps_app:ci-only-password@db:5432/sps_dashboard #gitleaks:allow
          DATABASE_RUNTIME_PASSWORD: ci-only-runtime-password #gitleaks:allow
          JWT_SECRET: ci-only-jwt-secret-long-enough-for-compose #gitleaks:allow
          BOOTSTRAP_PASSWORD: ci-only-bootstrap-password #gitleaks:allow
          APP_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA= #gitleaks:allow
        run: docker compose config --quiet

      - name: Verify staging defaults to localhost-only access
        env:
          POSTGRES_PASSWORD: ci-only-password #gitleaks:allow
          DATABASE_URL: postgresql+psycopg://sps_runtime:ci-only-runtime-password@db:5432/sps_dashboard #gitleaks:allow
          DATABASE_ADMIN_URL: postgresql+psycopg://sps_app:ci-only-password@db:5432/sps_dashboard #gitleaks:allow
          DATABASE_RUNTIME_PASSWORD: ci-only-runtime-password #gitleaks:allow
          JWT_SECRET: ci-only-jwt-secret-long-enough-for-compose #gitleaks:allow
          BOOTSTRAP_PASSWORD: ci-only-bootstrap-password #gitleaks:allow
          APP_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA= #gitleaks:allow
        run: docker compose config --format json | jq -e '.services.proxy.ports | any(.host_ip == "127.0.0.1" and .published == "8080" and .target == 80)'

  deploy-staging:
    name: Deploy staging on WSL laptop
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality-and-tests, secret-scan, container]
    runs-on: [self-hosted, linux, x64, sps-staging]
    environment:
      name: staging
    concurrency:
      group: sps-staging-deploy
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - name: Check out tested main revision
        uses: actions/checkout@v7

      - name: Deploy and smoke-check staging
        run: bash scripts/deploy-staging.sh
