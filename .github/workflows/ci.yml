name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Python quality, security, migrations, and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_DB: sps_dashboard
          POSTGRES_USER: sps_app
          POSTGRES_PASSWORD: ci-only-password #gitleaks:allow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sps_app -d sps_dashboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sps_app:ci-only-password@localhost:5432/sps_dashboard #gitleaks:allow
      JWT_SECRET: ci-only-jwt-secret-long-enough-for-tests #gitleaks:allow
      BOOTSTRAP_PASSWORD: ci-only-bootstrap-password #gitleaks:allow
      APP_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA= #gitleaks:allow
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and CI tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Lint
        run: ruff check app tests migrations

      - name: Check formatting
        run: ruff format --check app tests migrations

      - name: Static security analysis
        run: bandit -q -r app

      - name: Audit Python dependencies
        run: pip-audit --skip-editable

      - name: Apply migrations to an empty PostgreSQL database
        run: alembic upgrade head

      - name: Verify migration idempotency and model parity
        run: |
          alembic upgrade head
          alembic check

      - name: Run API and business-rule tests with coverage report
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Compile application and migration sources
        run: python -m compileall -q app migrations

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2

  container:
    name: Build and scan production container
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag sps-student-dashboard:ci .

      - name: Scan image for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sps-student-dashboard:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-password #gitleaks:allow
          JWT_SECRET: ci-only-jwt-secret-long-enough-for-compose #gitleaks:allow
          BOOTSTRAP_PASSWORD: ci-only-bootstrap-password #gitleaks:allow
          APP_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA= #gitleaks:allow
        run: docker compose config --quiet
